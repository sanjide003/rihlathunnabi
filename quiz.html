<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fest Quiz 2026</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Base styles preventing bounce/zoom on mobile */
        body { 
            font-family: 'Nunito', sans-serif; 
            margin: 0; padding: 0; 
            height: 100svh; width: 100vw; 
            overflow: hidden; 
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        input, textarea, select {
            font-size: 16px; /* Prevents iOS Safari Zoom */
            -webkit-user-select: text;
        }

        /* Festive Watercolor Background - Mimicking the Image */
        .festive-art-bg {
            background-color: #fdf2f8; /* Very light pink */
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(253, 164, 175, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 90% 20%, rgba(147, 197, 253, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(216, 180, 254, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(134, 239, 172, 0.3) 0%, transparent 40%);
            background-size: cover;
            position: fixed; inset: 0; z-index: -2;
        }

        /* Sparkle/Texture overlay */
        .festive-art-bg::after {
            content: ''; position: absolute; inset: 0; opacity: 0.4;
            background-image: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1.5" fill="%23cbd5e1"/></svg>');
            background-size: 30px 30px; z-index: -1;
        }

        /* Glass Card specific to the Image Vibe */
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            border-radius: 2.5rem; /* Highly rounded like the image */
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1), 0 0 15px rgba(255, 255, 255, 0.5) inset;
        }

        /* Custom Radio Buttons */
        .option-radio:checked + label {
            background-color: #ecfdf5 !important; /* Emerald 50 */
            border-color: #10b981 !important; /* Emerald 500 */
        }
        .option-radio:checked + label .opt-letter {
            background-color: #10b981 !important;
            color: white !important;
        }
        .option-radio:checked + label .opt-check {
            opacity: 1 !important;
            transform: scale(1) !important;
        }
        
        .opt-check { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Liquid Wave Timer CSS */
        .timer-circle {
            position: relative; width: 140px; height: 140px;
            border-radius: 50%; overflow: hidden;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), inset 0 0 10px rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: center;
        }
        
        /* The Wave Animation */
        .wave {
            position: absolute; left: -50%; width: 200%; height: 200%;
            background: rgba(52, 211, 153, 0.2); /* Base Green */
            border-radius: 40%;
            animation: spin 6s infinite linear;
            transition: top 1s linear, background-color 1s ease;
            z-index: 1;
        }
        .wave-fill {
            position: absolute; left: -50%; width: 200%; height: 200%;
            background: rgba(52, 211, 153, 0.5); /* Solid Green */
            border-radius: 43%;
            animation: spin 7s infinite linear;
            transition: top 1s linear, background-color 1s ease;
            z-index: 1;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Gradient Border for Timer */
        .timer-border {
            position: absolute; inset: 0; border-radius: 50%;
            padding: 5px; /* Border thickness */
            background: linear-gradient(135deg, #f43f5e, #8b5cf6, #3b82f6);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: 3;
        }

        .timer-content { position: relative; z-index: 10; text-align: center; }

        .hidden-safe { display: none !important; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-pink-200">

    <!-- Artistic Background -->
    <div class="festive-art-bg"></div>

    <!-- Loading Spinner -->
    <div id="loader" class="fixed inset-0 z-[500] flex flex-col items-center justify-center bg-white/70 backdrop-blur-sm hidden-safe transition-opacity">
        <div class="animate-spin rounded-full h-14 w-14 border-4 border-slate-200 border-t-pink-500 mb-4"></div>
        <p class="text-sm font-bold text-slate-600 tracking-wider">LOADING...</p>
    </div>

    <!-- System Modal Alert (Re-designed for theme) -->
    <div id="sys-modal" class="fixed inset-0 z-[100] hidden-safe bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-5 opacity-0 transition-opacity">
        <div class="bg-white rounded-[2rem] p-6 w-full max-w-sm shadow-2xl transform scale-95 transition-transform" id="sys-modal-card">
            <div class="text-center mb-4" id="sys-modal-icon"></div>
            <h3 class="text-xl font-black text-slate-800 text-center mb-2 font-['Quicksand']" id="sys-modal-title">Title</h3>
            <p class="text-sm text-slate-600 font-semibold text-center mb-6 leading-relaxed" id="sys-modal-msg">Message</p>
            <div class="flex space-x-3" id="sys-modal-btns">
                <!-- Buttons injected via JS -->
            </div>
        </div>
    </div>

    <!-- Instructions Modal -->
    <div id="instructions-modal" class="fixed inset-0 z-50 hidden-safe bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="bg-gradient-to-r from-pink-500 to-purple-500 p-6 text-white text-center shrink-0">
                <h2 class="text-2xl font-black flex items-center justify-center font-['Quicksand']">
                    <i class="fa-solid fa-scroll mr-2"></i> Quiz Rules
                </h2>
            </div>
            <div class="p-6 overflow-y-auto flex-1 bg-slate-50/50">
                <ul id="instructions-content" class="text-sm text-slate-700 font-bold leading-relaxed space-y-3">
                    <!-- Rules injected -->
                </ul>
            </div>
            <div class="p-5 bg-white shrink-0">
                <button onclick="window.closeInstructions()" class="w-full bg-slate-900 hover:bg-black text-white font-black py-4 rounded-2xl shadow-xl transition-transform active:scale-95 flex justify-center items-center text-lg">
                    I Agree & Continue <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="user-app" class="h-full flex flex-col overflow-y-auto">
        <div class="pt-8 pb-8 px-4 flex-1 flex flex-col items-center justify-center min-h-full">
            
            <!-- Login Card -->
            <div id="auth-section" class="w-full max-w-sm glass-card p-8 transition-all duration-500 transform relative z-10">
                
                <!-- Animated README / Instructions Button -->
                <button onclick="document.getElementById('instructions-modal').classList.remove('hidden-safe')" class="absolute top-5 right-5 flex flex-col items-center justify-center text-pink-500 hover:text-pink-600 transition-transform active:scale-90 group cursor-pointer">
                    <div class="w-10 h-10 bg-pink-100/90 rounded-full flex items-center justify-center shadow-md animate-bounce group-hover:bg-pink-200 border border-pink-200">
                        <i class="fa-solid fa-scroll text-base text-pink-600"></i>
                    </div>
                    <span class="text-[9px] font-black tracking-widest text-pink-600 animate-pulse mt-0.5">README</span>
                </button>

                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-[0_10px_20px_rgba(236,72,153,0.2)] overflow-hidden">
                        <i class="fa-solid fa-masks-theater text-4xl text-pink-500" id="default-logo-login"></i>
                        <img id="custom-logo-login" src="" class="hidden-safe w-full h-full object-cover">
                    </div>
                    <h2 class="text-3xl font-black text-slate-800 font-['Quicksand'] tracking-tight">Join Fest Quiz</h2>
                    <p class="text-sm text-slate-500 font-bold mt-1">Enter details to start the challenge</p>
                </div>
                
                <div class="space-y-4">
                    <div class="relative">
                        <i class="fa-solid fa-phone absolute left-4 top-4 text-slate-400"></i>
                        <input type="tel" id="login-phone" maxlength="10" class="w-full pl-12 pr-4 py-3.5 bg-slate-50/80 border-2 border-slate-100 rounded-2xl font-bold text-slate-700 outline-none focus:bg-white focus:border-pink-400 transition-all shadow-sm" placeholder="10 Digit Phone Number" oninput="window.handlePhoneInput(this.value)">
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-venus-mars absolute left-4 top-4 text-slate-400"></i>
                        <select id="login-gender" class="w-full pl-12 pr-4 py-3.5 bg-slate-50/80 border-2 border-slate-100 rounded-2xl font-bold text-slate-700 outline-none focus:bg-white focus:border-pink-400 transition-all shadow-sm appearance-none">
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-4.5 text-slate-400 text-xs pointer-events-none"></i>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-4 text-slate-400"></i>
                        <input type="text" id="login-name" class="w-full pl-12 pr-4 py-3.5 bg-slate-50/80 border-2 border-slate-100 rounded-2xl font-bold text-slate-700 outline-none focus:bg-white focus:border-pink-400 transition-all shadow-sm" placeholder="Full Name">
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-400"></i>
                        <input type="password" id="login-password" class="w-full pl-12 pr-4 py-3.5 bg-slate-50/80 border-2 border-slate-100 rounded-2xl font-bold text-slate-700 outline-none focus:bg-white focus:border-pink-400 transition-all shadow-sm" placeholder="Password (Min 4 chars)">
                    </div>
                    
                    <button onclick="window.handleLogin()" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black py-4 rounded-2xl shadow-xl shadow-pink-200 transition-transform active:scale-95 flex justify-center items-center mt-6 text-lg">
                        START QUIZ <i class="fa-solid fa-play ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- Quiz Active Area -->
            <div id="quiz-section" class="w-full max-w-[420px] hidden-safe flex-col items-center relative z-10 w-full">
                
                <!-- Top Question Pill -->
                <div class="bg-white/90 backdrop-blur-md px-6 py-2 rounded-full shadow-md text-pink-600 font-black tracking-wider text-sm mb-6 border border-white">
                    QUESTION <span id="q-counter">1/3</span>
                </div>

                <!-- Center Circular Timer -->
                <div class="timer-circle mx-auto mb-6">
                    <div class="timer-border"></div>
                    <div id="wave-bg" class="wave" style="top: 100%;"></div>
                    <div id="wave-fg" class="wave-fill" style="top: 100%;"></div>
                    
                    <div class="timer-content">
                        <div id="timer-text" class="text-5xl font-black text-rose-500 tracking-tighter">30</div>
                        <div id="timer-label" class="text-[10px] font-black text-rose-400 uppercase tracking-widest mt-0.5">SEC LEFT</div>
                    </div>
                </div>

                <!-- Question Card -->
                <div class="glass-card w-full p-6 sm:p-8 flex flex-col relative overflow-hidden">
                    
                    <!-- Question Header with Icon -->
                    <div class="flex items-start mb-6">
                        <div class="w-12 h-12 rounded-full bg-pink-100 flex items-center justify-center shrink-0 mr-4 shadow-inner overflow-hidden">
                            <i class="fa-solid fa-palette text-2xl text-pink-500" id="default-logo-quiz"></i>
                            <img id="custom-logo-quiz" src="" class="hidden-safe w-full h-full object-cover">
                        </div>
                        <h3 id="quiz-question-text" class="text-lg sm:text-xl font-black text-slate-800 leading-snug pt-1">
                            Loading question...
                        </h3>
                    </div>

                    <!-- Options Area -->
                    <div id="quiz-options-container" class="space-y-3 flex-1 mb-6">
                        <!-- Options injected dynamically -->
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex space-x-3 mt-auto" id="quiz-action-buttons">
                        <button id="btn-skip" onclick="window.handleAction('skip')" class="flex-1 bg-rose-50 text-rose-600 border-2 border-rose-100 font-black py-4 rounded-2xl transition-transform active:scale-95 flex justify-center items-center">
                            <i class="fa-solid fa-forward-step mr-2"></i> SKIP
                        </button>
                        <button id="btn-submit" onclick="window.handleAction('submit')" class="flex-[1.5] bg-[#10b981] text-white font-black py-4 rounded-2xl shadow-lg shadow-emerald-200 transition-transform active:scale-95 flex justify-center items-center">
                            SUBMIT <i class="fa-solid fa-check ml-2 text-xl"></i>
                        </button>
                        
                        <!-- Next Button (Hidden initially) -->
                        <button id="btn-next" onclick="window.handleAction('next')" class="hidden-safe w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl transition-transform active:scale-95 justify-center items-center">
                            NEXT QUESTION <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Daily Result Area -->
            <div id="result-section" class="w-full max-w-sm glass-card p-8 hidden-safe text-center transform transition-all duration-500 scale-95 opacity-0 relative z-10">
                <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto mb-5 shadow-[0_10px_25px_rgba(16,185,129,0.3)]">
                    <i class="fa-solid fa-trophy text-5xl text-emerald-500"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800 font-['Quicksand'] mb-1" id="res-day-title">Day 1 Result</h2>
                <p class="text-sm text-slate-500 font-bold mb-6">You have completed today's challenge!</p>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <!-- Earned Points -->
                    <div class="bg-emerald-50 border-2 border-emerald-100 p-4 rounded-3xl relative overflow-hidden">
                        <div class="absolute -right-3 -top-3 opacity-10"><i class="fa-solid fa-circle-plus text-5xl text-emerald-500"></i></div>
                        <div class="text-[10px] text-emerald-600 font-black uppercase tracking-wider mb-1 relative z-10">Earned</div>
                        <div class="text-3xl font-black text-emerald-600 relative z-10" id="res-earned">+0</div>
                    </div>
                    <!-- Lost Points -->
                    <div class="bg-rose-50 border-2 border-rose-100 p-4 rounded-3xl relative overflow-hidden">
                        <div class="absolute -right-3 -top-3 opacity-10"><i class="fa-solid fa-circle-minus text-5xl text-rose-500"></i></div>
                        <div class="text-[10px] text-rose-600 font-black uppercase tracking-wider mb-1 relative z-10">Lost</div>
                        <div class="text-3xl font-black text-rose-600 relative z-10" id="res-lost">-0</div>
                    </div>
                </div>

                <!-- Net Points (Total Today) -->
                <div class="bg-indigo-50 border-2 border-indigo-100 p-4 rounded-3xl relative overflow-hidden mb-8 shadow-inner flex flex-col items-center justify-center">
                    <div class="absolute -right-2 -bottom-2 opacity-10"><i class="fa-solid fa-ranking-star text-6xl text-indigo-500"></i></div>
                    <div class="text-[10px] text-indigo-600 font-black uppercase tracking-widest mb-1 relative z-10">Total Points Today</div>
                    <div class="text-5xl font-black text-indigo-700 relative z-10" id="res-net-score">0</div>
                </div>

                <button onclick="window.resetToHome()" class="w-full bg-slate-900 hover:bg-black text-white font-black py-4 rounded-2xl shadow-xl transition-transform active:scale-95 text-lg">
                    OK
                </button>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfJSonmGHnf0t92B71ycuAZbc-CV3k7LE",
            authDomain: "fest-dsd-003.firebaseapp.com",
            projectId: "fest-dsd-003",
            storageBucket: "fest-dsd-003.firebasestorage.app",
            messagingSenderId: "409596394273",
            appId: "1:409596394273:web:b930012ce0a845ddb45c60",
            measurementId: "G-WSPJPQR032"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.AppState = {
            user: null, 
            allQuestions: [],
            dailyQuestions: [],
            currentQIndex: 0,
            timerInterval: null,
            timeLeft: 30,
            totalTimeLimit: 30,
            currentDay: 1,
            isLocked: false,
            todayEarned: 0,
            todayLost: 0,
            settings: { questionMode: 'fixed', instructions: '', scoringEnabled: false, pointsCorrect: 10, pointsNegative: 0 }
        };

        const docPath = (coll, id) => doc(db, coll, id);

        // Core UI Helpers
        window.showModal = function(title, msg, iconClass, customBtns = null) {
            const m = document.getElementById('sys-modal');
            const mc = document.getElementById('sys-modal-card');
            document.getElementById('sys-modal-title').innerText = title;
            document.getElementById('sys-modal-msg').innerText = msg;
            document.getElementById('sys-modal-icon').innerHTML = `<i class="${iconClass} text-5xl"></i>`;
            
            if(customBtns) { 
                document.getElementById('sys-modal-btns').innerHTML = customBtns; 
            } else { 
                document.getElementById('sys-modal-btns').innerHTML = `<button onclick="window.closeModal()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl transition-colors text-sm">OK</button>`; 
            }
            
            m.classList.remove('hidden-safe');
            setTimeout(() => { m.classList.remove('opacity-0'); mc.classList.remove('scale-95'); }, 10);
        };

        window.closeModal = function() {
            const m = document.getElementById('sys-modal');
            const mc = document.getElementById('sys-modal-card');
            m.classList.add('opacity-0'); mc.classList.add('scale-95');
            setTimeout(() => m.classList.add('hidden-safe'), 300);
        };

        window.showLoader = function() { document.getElementById('loader').classList.remove('hidden-safe'); };
        window.hideLoader = function() { document.getElementById('loader').classList.add('hidden-safe'); };

        // Calculate Current Day
        function calcCurrentDay(startStr) {
            if(!startStr) return 1;
            const start = new Date(startStr); start.setHours(0,0,0,0);
            const now = new Date(); now.setHours(0,0,0,0);
            const diffDays = Math.floor(Math.abs(now - start) / (1000 * 60 * 60 * 24)) + 1;
            return diffDays > 0 ? diffDays : 1;
        }

        // Initialize App & Listeners
        async function initApp() {
            onSnapshot(docPath('settings', 'global'), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    window.AppState.settings = {
                        questionMode: data.questionMode || 'fixed',
                        instructions: data.instructions || '',
                        scoringEnabled: data.scoringEnabled || false,
                        pointsCorrect: parseInt(data.pointsCorrect) || 10,
                        pointsNegative: parseInt(data.pointsNegative) || 0
                    };
                    
                    // Handle Logo Update Dynamically
                    const logoLogin = document.getElementById('custom-logo-login');
                    const defaultLogin = document.getElementById('default-logo-login');
                    const logoQuiz = document.getElementById('custom-logo-quiz');
                    const defaultQuiz = document.getElementById('default-logo-quiz');
                    
                    if (data.logoBase64) {
                        if(logoLogin) { logoLogin.src = data.logoBase64; logoLogin.classList.remove('hidden-safe'); defaultLogin.classList.add('hidden-safe'); }
                        if(logoQuiz) { logoQuiz.src = data.logoBase64; logoQuiz.classList.remove('hidden-safe'); defaultQuiz.classList.add('hidden-safe'); }
                    } else {
                        if(logoLogin) { logoLogin.src = ''; logoLogin.classList.add('hidden-safe'); defaultLogin.classList.remove('hidden-safe'); }
                        if(logoQuiz) { logoQuiz.src = ''; logoQuiz.classList.add('hidden-safe'); defaultQuiz.classList.remove('hidden-safe'); }
                    }

                    if(data.startDate) window.AppState.currentDay = calcCurrentDay(data.startDate);
                    renderInstructions();
                }
            });

            onSnapshot(collection(db, "questions"), (snap) => {
                window.AppState.allQuestions = [];
                snap.forEach(doc => { window.AppState.allQuestions.push({ id: doc.id, ...doc.data() }); });
            });
            
            document.getElementById('instructions-modal').classList.remove('hidden-safe');
            setupBackButtonTrap();
        }

        function renderInstructions() {
            const ul = document.getElementById('instructions-content');
            const txt = window.AppState.settings.instructions;
            if(!txt.trim()) { ul.innerHTML = `<li class="flex items-start"><i class="fa-solid fa-circle-check text-emerald-500 mt-1 mr-3"></i> <span>Ready to play! No specific rules set.</span></li>`; return; }
            ul.innerHTML = txt.split('\n').filter(l => l.trim() !== '').map(l => `<li class="flex items-start"><i class="fa-solid fa-star text-pink-400 mt-1 mr-3 text-[10px]"></i> <span>${l}</span></li>`).join('');
        }
        
        window.closeInstructions = function() {
            document.getElementById('instructions-modal').classList.add('hidden-safe');
        }

        window.handlePhoneInput = async function(val) {
            const clean = val.replace(/\D/g,'').slice(0,10);
            const phoneEl = document.getElementById('login-phone');
            phoneEl.value = clean;
            
            if(clean.length === 10) {
                try {
                    const snap = await getDoc(docPath('users', clean));
                    if(snap.exists()) {
                        const d = snap.data();
                        document.getElementById('login-name').value = d.name;
                        document.getElementById('login-gender').value = d.gender;
                        // Visual cue for auto-fill
                        document.getElementById('login-name').classList.add('bg-emerald-50', 'border-emerald-300');
                    }
                } catch(e) { console.warn(e); }
            } else {
                document.getElementById('login-name').classList.remove('bg-emerald-50', 'border-emerald-300');
            }
        };

        window.handleLogin = async function() {
            const phone = document.getElementById('login-phone').value.trim();
            const name = document.getElementById('login-name').value.trim();
            const gender = document.getElementById('login-gender').value;
            const pass = document.getElementById('login-password').value;

            if(phone.length !== 10) { showModal("Error", "Please enter exactly 10 digits.", "fa-solid fa-circle-exclamation text-rose-500"); return; }
            if(!name || !gender) { showModal("Error", "Please fill all fields.", "fa-solid fa-circle-exclamation text-rose-500"); return; }
            if(pass.length < 4) { showModal("Error", "Password minimum 4 characters.", "fa-solid fa-circle-exclamation text-rose-500"); return; }

            showLoader();
            try {
                const userRef = docPath('users', phone);
                const snap = await getDoc(userRef);
                let userData = { phone, name, gender, password: pass, totalScore: 0, history: {}, lastDayPlayed: 0 };
                
                if(snap.exists()) {
                    const d = snap.data();
                    if(d.password !== pass) { hideLoader(); showModal("Error", "Incorrect password.", "fa-solid fa-lock text-rose-500"); return; }
                    userData = d;
                    
                    // Daily Participation Check
                    if(userData.lastDayPlayed === window.AppState.currentDay) {
                        hideLoader();
                        
                        // Calculate today's earned & lost points from history
                        let earned = 0, lost = 0;
                        if(userData.history) {
                            const todayQIds = window.AppState.allQuestions
                                .filter(q => q.mode !== 'random' && parseInt(q.day) === window.AppState.currentDay)
                                .map(q => q.id);
                            
                            Object.keys(userData.history).forEach(qId => {
                                const rec = userData.history[qId];
                                if(todayQIds.includes(qId) || (rec.timeAt && new Date(rec.timeAt).toDateString() === new Date().toDateString())) {
                                    if(rec.correct) {
                                        earned += window.AppState.settings.scoringEnabled ? window.AppState.settings.pointsCorrect : 10;
                                    } else if(rec.answer) {
                                        lost += window.AppState.settings.scoringEnabled ? window.AppState.settings.pointsNegative : 0;
                                    }
                                }
                            });
                        }

                        const btns = `<button onclick="window.closeModal(); window.showAlreadyPlayedResult(${earned}, ${lost})" class="w-full bg-emerald-500 text-white font-bold py-3.5 rounded-xl">OK</button>`;

                        showModal("Already Played", "You have already participated today. Only one attempt is allowed per day.", "fa-solid fa-calendar-check text-emerald-500", btns);
                        return;
                    }
                } else {
                    await setDoc(userRef, userData);
                }

                window.AppState.user = userData;
                window.AppState.todayEarned = 0;
                window.AppState.todayLost = 0;
                
                prepareQuestions();
            } catch(e) { hideLoader(); showModal("System Error", e.message, "fa-solid fa-triangle-exclamation text-rose-500"); }
        };

        function prepareQuestions() {
            const mode = window.AppState.settings.questionMode;
            let selectedQ = [];

            if(mode === 'random') {
                const historyIds = window.AppState.user.history ? Object.keys(window.AppState.user.history) : [];
                let pool = window.AppState.allQuestions.filter(q => q.mode === 'random' && !historyIds.includes(q.id));
                // Shuffle
                for(let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
                selectedQ = pool.slice(0, 3); // Default 3
            } else {
                selectedQ = window.AppState.allQuestions.filter(q => q.mode !== 'random' && parseInt(q.day) === window.AppState.currentDay);
                selectedQ.sort((a,b) => a.slotIndex - b.slotIndex);
            }

            if(selectedQ.length === 0) {
                hideLoader();
                showModal("Wait!", "Questions for today are not ready yet. Please try again later.", "fa-solid fa-clock text-amber-500");
                return;
            }

            window.AppState.dailyQuestions = selectedQ;
            window.AppState.currentQIndex = 0;
            
            // Push state for back button trap
            window.history.pushState({page: 'quiz'}, "", window.location.href);

            document.getElementById('auth-section').classList.add('hidden-safe');
            document.getElementById('quiz-section').classList.remove('hidden-safe');
            document.getElementById('quiz-section').classList.add('flex');
            
            hideLoader();
            loadQuestion();
        }

        function loadQuestion() {
            window.AppState.isLocked = false;
            
            // UI Reset
            document.getElementById('btn-skip').classList.remove('hidden-safe');
            document.getElementById('btn-submit').classList.remove('hidden-safe');
            document.getElementById('btn-next').classList.add('hidden-safe');
            document.getElementById('btn-next').classList.remove('flex');

            const q = window.AppState.dailyQuestions[window.AppState.currentQIndex];
            document.getElementById('q-counter').innerText = `${window.AppState.currentQIndex + 1}/${window.AppState.dailyQuestions.length}`;
            document.getElementById('quiz-question-text').innerText = q.text;
            
            const cont = document.getElementById('quiz-options-container');
            cont.innerHTML = '';
            
            if(q.type === 'mcq') {
                const letters = ['A','B','C','D'];
                q.options.forEach((opt, idx) => {
                    const id = `opt_${idx}`;
                    cont.innerHTML += `
                        <div class="relative mb-3">
                            <input type="radio" name="quiz_option" id="${id}" value="${opt}" class="option-radio sr-only" onchange="window.handleSelect()">
                            <label for="${id}" class="flex items-center p-4 border-2 border-slate-100 bg-white rounded-2xl cursor-pointer transition-all text-slate-700 font-bold relative overflow-hidden group">
                                <div class="opt-letter w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mr-4 text-sm transition-colors shrink-0">${letters[idx]}</div>
                                <span class="pr-8">${opt}</span>
                                <i class="opt-check fa-solid fa-circle-check absolute right-4 text-2xl text-emerald-500 opacity-0 transform scale-50"></i>
                            </label>
                        </div>
                    `;
                });
            } else {
                cont.innerHTML = `<textarea id="quiz-text-answer" rows="3" class="w-full p-4 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:border-pink-400 bg-white" placeholder="Type your answer here..." oninput="window.handleSelect()"></textarea>`;
            }

            startTimer(q.timeLimit || 30);
        }

        window.handleSelect = function() {
            // Un-require explicit selection if needed, just a hook for future UI updates
        };

        function startTimer(seconds) {
            clearInterval(window.AppState.timerInterval);
            window.AppState.totalTimeLimit = seconds;
            window.AppState.timeLeft = seconds;
            
            const wBg = document.getElementById('wave-bg');
            const wFg = document.getElementById('wave-fg');
            const txt = document.getElementById('timer-text');
            const lbl = document.getElementById('timer-label');
            
            updateWaveUI(seconds, wBg, wFg, txt, lbl);

            window.AppState.timerInterval = setInterval(() => {
                if(window.AppState.isLocked) return;
                
                window.AppState.timeLeft--;
                updateWaveUI(window.AppState.timeLeft, wBg, wFg, txt, lbl);
                
                if(window.AppState.timeLeft <= 0) {
                    clearInterval(window.AppState.timerInterval);
                    window.processAnswer(true); // Auto-lock on timeout
                }
            }, 1000);
        }

        function updateWaveUI(timeLeft, wBg, wFg, txt, lbl) {
            const pct = (timeLeft / window.AppState.totalTimeLimit) * 100;
            const drop = 100 - pct; 
            
            wBg.style.top = `${drop}%`;
            wFg.style.top = `${drop}%`;
            txt.innerText = timeLeft;
            
            // Color Logic matching prompt
            let color = 'rgba(52, 211, 153,'; // Emerald Base
            let txtColor = '#10b981';
            
            if(pct <= 60 && pct > 30) { 
                color = 'rgba(245, 158, 11,'; // Orange Base
                txtColor = '#f59e0b';
            } else if (pct <= 30) {
                color = 'rgba(244, 63, 94,'; // Rose/Red Base
                txtColor = '#f43f5e';
            }

            wBg.style.backgroundColor = `${color} 0.2)`;
            wFg.style.backgroundColor = `${color} 0.5)`;
            txt.style.color = txtColor;
            lbl.style.color = txtColor;
        }

        window.handleAction = function(type) {
            if(window.AppState.isLocked && type !== 'next') return;

            if(type === 'skip') {
                const btns = `
                    <button onclick="window.closeModal()" class="flex-1 bg-slate-200 text-slate-800 font-bold py-3.5 rounded-xl text-sm">Cancel</button>
                    <button onclick="window.closeModal(); window.processAnswer(false, true)" class="flex-1 bg-rose-500 text-white font-bold py-3.5 rounded-xl text-sm">Yes, Skip</button>`;
                showModal("Skip Question?", "You won't get any points for this. Are you sure?", "fa-solid fa-forward text-amber-500", btns);
            } 
            else if(type === 'submit') {
                const q = window.AppState.dailyQuestions[window.AppState.currentQIndex];
                let hasAns = false;
                if (q.type === 'mcq') { hasAns = document.querySelector('input[name="quiz_option"]:checked') !== null; } 
                else { hasAns = document.getElementById('quiz-text-answer').value.trim() !== ''; }

                if(!hasAns) { showModal("No Answer", "Please select or type an answer before submitting.", "fa-solid fa-hand text-rose-500"); return; }

                const btns = `
                    <button onclick="window.closeModal()" class="flex-1 bg-slate-200 text-slate-800 font-bold py-3.5 rounded-xl text-sm">Cancel</button>
                    <button onclick="window.closeModal(); window.processAnswer(false, false)" class="flex-1 bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-sm">Lock Answer</button>`;
                showModal("Submit Answer?", "You cannot change this once submitted.", "fa-solid fa-lock text-emerald-500", btns);
            }
            else if(type === 'next') {
                if(window.AppState.currentQIndex === window.AppState.dailyQuestions.length - 1) {
                    window.finishQuiz();
                } else {
                    window.AppState.currentQIndex++;
                    loadQuestion();
                }
            }
        };

        window.processAnswer = function(isTimeout = false, isSkip = false) {
            window.AppState.isLocked = true;
            clearInterval(window.AppState.timerInterval);
            
            const q = window.AppState.dailyQuestions[window.AppState.currentQIndex];
            let ans = null;

            // Lock Inputs visually
            if (q.type === 'mcq') {
                document.querySelectorAll('input[name="quiz_option"]').forEach(el => el.disabled = true);
                const sel = document.querySelector('input[name="quiz_option"]:checked');
                if(sel) ans = sel.value;
            } else {
                const txt = document.getElementById('quiz-text-answer');
                if(txt) { txt.disabled = true; ans = txt.value.trim(); }
            }

            // Scoring Logic
            if(!isSkip && !isTimeout) {
                let isCorrect = (ans && ans.toLowerCase() === q.answer.trim().toLowerCase());
                
                if (window.AppState.settings.scoringEnabled) {
                    if(isCorrect) window.AppState.todayEarned += window.AppState.settings.pointsCorrect;
                    else if(ans) window.AppState.todayLost += window.AppState.settings.pointsNegative; 
                } else {
                    if(isCorrect) window.AppState.todayEarned += 10;
                }
                
                // Save locally to history
                if(!window.AppState.user.history) window.AppState.user.history = {};
                window.AppState.user.history[q.id] = { answer: ans, correct: isCorrect, timeAt: new Date().toISOString() };
            }

            // Toggle Buttons to NEXT
            document.getElementById('btn-skip').classList.add('hidden-safe');
            document.getElementById('btn-submit').classList.add('hidden-safe');
            document.getElementById('btn-next').classList.remove('hidden-safe');
            document.getElementById('btn-next').classList.add('flex');

            if(isTimeout) {
                document.getElementById('btn-next').innerHTML = `TIME UP - NEXT <i class="fa-solid fa-arrow-right ml-2"></i>`;
                document.getElementById('btn-next').className = "flex w-full bg-rose-600 text-white font-black py-4 rounded-2xl shadow-xl transition-transform active:scale-95 justify-center items-center";
            } else {
                document.getElementById('btn-next').innerHTML = (window.AppState.currentQIndex === window.AppState.dailyQuestions.length - 1) ? `FINISH QUIZ <i class="fa-solid fa-flag-checkered ml-2"></i>` : `NEXT QUESTION <i class="fa-solid fa-arrow-right ml-2"></i>`;
                document.getElementById('btn-next').className = "flex w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl transition-transform active:scale-95 justify-center items-center";
            }
        };

        window.finishQuiz = async function() {
            showLoader();
            
            // Calculate final net score logically for DB
            const netToday = window.AppState.todayEarned - window.AppState.todayLost;
            window.AppState.user.totalScore += netToday;
            window.AppState.user.lastDayPlayed = window.AppState.currentDay;
            
            try {
                await updateDoc(docPath('users', window.AppState.user.phone), {
                    totalScore: window.AppState.user.totalScore,
                    lastDayPlayed: window.AppState.user.lastDayPlayed,
                    history: window.AppState.user.history
                });
                
                hideLoader();
                document.getElementById('quiz-section').classList.add('hidden-safe');
                document.getElementById('quiz-section').classList.remove('flex');
                
                const rsec = document.getElementById('result-section');
                rsec.classList.remove('hidden-safe');
                
                document.getElementById('res-day-title').innerText = `Day ${window.AppState.currentDay} Result`;
                document.getElementById('res-earned').innerText = `+${window.AppState.todayEarned}`;
                document.getElementById('res-lost').innerText = `-${window.AppState.todayLost}`;
                document.getElementById('res-net-score').innerText = netToday > 0 ? `+${netToday}` : netToday;
                
                setTimeout(() => { rsec.classList.remove('scale-95', 'opacity-0'); }, 50);
            } catch(e) { 
                hideLoader(); showModal("Save Error", e.message, "fa-solid fa-triangle-exclamation text-rose-500"); 
            }
        };

        // Back Button Trap Logic
        function setupBackButtonTrap() {
            window.addEventListener('popstate', (e) => {
                const qSec = document.getElementById('quiz-section');
                if(!qSec.classList.contains('hidden-safe')) {
                    // Prevent back navigation
                    window.history.pushState({page: 'quiz'}, "", window.location.href);
                    
                    const btns = `
                        <button onclick="window.closeModal()" class="flex-1 bg-slate-200 text-slate-800 font-bold py-3.5 rounded-xl text-sm">Cancel</button>
                        <button onclick="window.forceExitQuiz()" class="flex-1 bg-rose-600 text-white font-bold py-3.5 rounded-xl text-sm">Exit Quiz</button>`;
                    showModal("Exit Alert!", "If you exit now, today's attempt will end. You cannot play again today. Proceed?", "fa-solid fa-right-from-bracket text-rose-500", btns);
                }
            });
        }

        window.forceExitQuiz = function() {
            closeModal();
            window.finishQuiz(); // Finish forcefully with whatever is saved
        };

        window.showAlreadyPlayedResult = function(earned, lost) {
            document.getElementById('auth-section').classList.add('hidden-safe');
            const rsec = document.getElementById('result-section');
            rsec.classList.remove('hidden-safe');
            
            const net = earned - lost;
            document.getElementById('res-day-title').innerText = `Day ${window.AppState.currentDay} Result`;
            document.getElementById('res-earned').innerText = `+${earned}`;
            document.getElementById('res-lost').innerText = `-${lost}`;
            document.getElementById('res-net-score').innerText = net > 0 ? `+${net}` : net;
            
            setTimeout(() => { rsec.classList.remove('scale-95', 'opacity-0'); }, 50);
        };

        window.resetToHome = function() {
            const rsec = document.getElementById('result-section');
            rsec.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                rsec.classList.add('hidden-safe');
                document.getElementById('auth-section').classList.remove('hidden-safe');
            }, 300);
            
            // Clear login form fields
            document.getElementById('login-phone').value = '';
            document.getElementById('login-name').value = '';
            document.getElementById('login-gender').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-name').classList.remove('bg-emerald-50', 'border-emerald-300');
        };

        window.onload = initApp;
    </script>
</body>
</html>
